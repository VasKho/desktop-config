font=Hack Nerd Font:size=9
term=xterm-256color
dpi-aware=yes
pad=3x1

[colors]
alpha=0.6

background=282828
foreground=CFC9C2
regular0=403E41
regular1=FF6188 # git unstaged changes color, archives color
regular2=A9DC76 # username, git branch name, executable color
regular3=FFD866 # git staged changes color
regular4=FC9867 # directories in ls color
regular5=AB9DF2 # parenthesis in git status color
regular6=78DCE8 # symlink color
regular7=FCFCFA # logs color
bright0=727072
bright1=FF6188
bright2=A9DC76
bright3=FFD866
bright4=FC9867
bright5=AB9DF2
bright6=78DCE8
bright7=FCFCFA


[key-bindings]
scrollback-home=Control+Mod1+Left
scrollback-end=Control+Mod1+Right
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
prompt-prev=Mod1+P
prompt-next=Mod1+N
search-start=Control+Shift+s
