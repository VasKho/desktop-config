system:
  theme: "Pink-Rose-Light"
  cursor: "volantes_light_cursors"
  icons: "oomox-rose-pine-moon"
  cursor_size: 24
  font: "Hack Nerd Font 11"
  dark_mode: false

modules:
  eww:
    export:
      format: "${{key}}=${{value}}"
      file: ".env"
    features:
      launcher: "$'swaymsg exec \\'$menu\\''"
      change_ws: "swaymsg workspace number"
      profiler: "$'swaymsg exec \\'footclient -a \"btop\" -e btop -p 0\\''"
      network: "$'swaymsg exec \\'footclient -a \"nmtui\" -e nmtui\\''"

  sway:
    export:
      format: "set $${{key}} ${{value}}"
      file: "vars.conf"
    features:
      audio:
        mic_mute: "${XDG_CONFIG_HOME}/eww/bin/mic"
        mute: "${XDG_CONFIG_HOME}/eww/bin/volume toggle"
        raise: "${XDG_CONFIG_HOME}/eww/bin/volume down 5"
        lower: "${XDG_CONFIG_HOME}eww/bin/volume up 5"
      music:
        play: "playerctl play-pause"
        next: "playerctl next"
        prev: "playerctl previous"
      brightness:
        raise: "${XDG_CONFIG_HOME}/eww/bin/backlight down 5"
        lower: "${XDG_CONFIG_HOME}/eww/bin/backlight up 5"
      default_apps:
        launcher: "rofi -show drun -config ${XDG_CONFIG_HOME}/rofi/launcher.rasi"
        statusbar: "${XDG_CONFIG_HOME}/eww/scripts/launch start"
        messenger: "Telegram"
        term: "footclient"
      screenshot:
        open_menu: "eww open-many screenshot"
        close_menu: "eww close screenshot"
      powermenu:
        open: "eww open-many powermenu"
        close: "eww close powermenu"
      theme: "pink-rose"

  rofi:
